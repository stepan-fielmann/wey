<button class="share-button" popovertarget="share">Share</button>

<div class="popup" id="share" popover>
  <h3>Share “Riverside redesign”</h3>
  <p>Anyone with the link can view.</p>
  <input value="https://example.com/p/1" readonly aria-label="Link" />
  <div class="popup-actions">
    <button class="primary">Copy link</button>
    <button popovertarget="share" popovertargetaction="hide">Close</button>
  </div>
</div>
